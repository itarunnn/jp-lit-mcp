name: Publish Package

on:
  workflow_dispatch:
    inputs:
      package-ref:
        description: "Git ref to publish, such as v0.7.7"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Check out package ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.package-ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Validate package ref and version
        shell: pwsh
        env:
          PACKAGE_REF: ${{ inputs.package-ref }}
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $validatedTag = node scripts/validate-publish-ref.mjs "$env:PACKAGE_REF" "$version"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ($validatedTag -cne "v$version") {
            throw "Validated tag does not match package version"
          }
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check package version is unpublished
        shell: pwsh
        run: |
          $viewOutput = npm view "jp-lit-mcp@$env:PACKAGE_VERSION" version --json 2>&1
          $viewStatus = $LASTEXITCODE
          $viewText = ($viewOutput | Out-String).Trim()

          if ($viewStatus -eq 0) {
            throw "jp-lit-mcp@$env:PACKAGE_VERSION is already published"
          }

          $versionIsAbsent =
            $viewText -match '(?im)\bE404\b' -or
            $viewText -match '(?im)No match found for version'

          if (-not $versionIsAbsent) {
            throw "npm view failed without a not-found response (exit $viewStatus): $viewText"
          }

          Write-Host "Confirmed jp-lit-mcp@$env:PACKAGE_VERSION is unpublished"

      - name: Publish to npm
        run: npm publish
